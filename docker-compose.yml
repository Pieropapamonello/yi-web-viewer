services:
  mediamtx:
    image: bluenviron/mediamtx:1.19.3
    container_name: camera-mediamtx
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      # EasyProxy already uses host port 8888 in the existing Docker stack.
      - "8890:8888"
    networks:
      - proxy-net

  # The IPC365 RTSP server returns a non-standard Transport header. FFmpeg
  # accepts it and republishes normalized H.264 + browser-compatible AAC.
  ipc365-bridge:
    image: lscr.io/linuxserver/ffmpeg:latest
    container_name: ipc365-bridge
    restart: unless-stopped
    depends_on:
      - mediamtx
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -rtsp_transport
      - tcp
      - -i
      - ${IPC365_RTSP_URL:?Set IPC365_RTSP_URL in .env before starting Docker}
      - -map
      - 0:v:0
      - -map
      - 0:a:0?
      - -c:v
      - copy
      - -c:a
      - aac
      - -b:a
      - 48k
      - -ar
      - "8000"
      - -ac
      - "1"
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://camera-mediamtx:8554/ipc365
    networks:
      - proxy-net

  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    networks:
      - proxy-net

  # Optional HLS proxy. Do not expose it publicly without a strong API_PASSWORD.
  # It proxies HLS already generated by MediaMTX; it does not accept RTSP directly.
  easyproxy:
    image: ghcr.io/realbestia1/easyproxy:latest
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      PORT: 7860
      API_PASSWORD: ${EASYPROXY_API_PASSWORD:-}
    ports:
      - "7860:7860"
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
    name: proxy-net
