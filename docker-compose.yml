services:
  fredi-control:
    build:
      context: ./gateway/onvif-api
      dockerfile: Dockerfile.unified
    image: fredi-control:local
    container_name: fredi-control
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      IPC365_RTSP_URL: ${IPC365_RTSP_URL:?Set IPC365_RTSP_URL in .env}
      FREDI_G1_RTSP_URL: ${FREDI_G1_RTSP_URL:?Set FREDI_G1_RTSP_URL in .env}
      MEDIAMTX_CONFIG: /etc/mediamtx.yml
    volumes:
      - ./mediamtx.yml:/etc/mediamtx.yml:ro
      - camera-gateway-data:/data
      - ${ARCHIVE_HOST_DIR:-C:/mediaflow/registrazioni}:/archive
    ports:
      - "127.0.0.1:3001:3000"
      - "8890:8888"
      - "8891:8889"
      - "8189:8189/udp"
      - "8189:8189/tcp"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health | grep -q '\"ok\":true' && ffprobe -v error -rtsp_transport tcp -show_entries stream=codec_type -of csv=p=0 rtsp://127.0.0.1:8554/ipc365 | grep -q video"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      proxy-net:
        aliases:
          - onvif-gateway
          - camera-mediamtx

  web:
    image: nginx:1.29-alpine
    profiles: ["local-web"]
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    networks:
      - proxy-net

  easyproxy:
    image: ghcr.io/realbestia1/easyproxy:latest
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      PORT: 7860
      API_PASSWORD: ${EASYPROXY_API_PASSWORD:-}
    ports:
      - "7860:7860"
    networks:
      - proxy-net

volumes:
  camera-gateway-data:

networks:
  proxy-net:
    external: true
    name: proxy-net
