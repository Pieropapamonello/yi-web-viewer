# RTSP sources are injected from the local .env file through Docker Compose.
hls: true
hlsAddress: :8888
hlsAllowOrigins: ['*']
hlsAlwaysRemux: true
hlsVariant: lowLatency

paths:
  ipc365:
    # The FFmpeg bridge publishes the normalized IPC365 stream here.
    source: publisher

  ipc365-low:
    # 480p profile generated locally for constrained mobile connections.
    source: publisher

  yi:
    # Reserved for the FREDI camera when its RTSP support is enabled.
    source: publisher
    rtspTransport: tcp
