services:
  # Deploys only the viewer interface. It never contains your RTSP URL.
  - type: web
    name: yi-web-viewer
    runtime: static
    buildCommand: "true"
    staticPublishPath: ./web
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; connect-src 'self' https:; media-src 'self' https: blob:; img-src 'self' data: blob:; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /service-worker.js
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
      - path: /app.js
        name: Cache-Control
        value: "no-cache, must-revalidate"
      - path: /app.css
        name: Cache-Control
        value: "no-cache, must-revalidate"
